name: Application integration
on:
  push:
    branches: [main, 'feat/**', 'fix/**', 'integration/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mongodb:
        image: public.ecr.aws/docker/library/mongo:8.0
        ports: ['27028:27017']
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1}).ok'"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            BackEnd/package-lock.json
            FrontEnd/aldiwanya-platform/package-lock.json
      - run: npm run install:all
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium
        working-directory: FrontEnd/aldiwanya-platform
      - run: npm run test:e2e --prefix FrontEnd/aldiwanya-platform
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-verification
          path: FrontEnd/aldiwanya-platform/test-results
          retention-days: 7
